<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notas</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f8f4e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f3ee;--sf:#fff;--tx:#1d2125;--mu:#6b7280;--bd:#e7e5dd;--ac:#2f8f4e;--ac2:#e6f3ea;--sh:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--sf:#1e2022;--tx:#ececea;--mu:#9a9fa6;--bd:#2f3236;--ac:#5cc47c;--ac2:#1f3326;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--sf:#1e2022;--tx:#ececea;--mu:#9a9fa6;--bd:#2f3236;--ac:#5cc47c;--ac2:#1f3326;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:240px 330px 1fr;height:100%}
#nav,#list,#ed{display:flex;flex-direction:column;min-height:0;min-width:0}
#nav{background:var(--bg);padding:18px 12px;overflow:auto}
#list{background:var(--sf);border-inline:1px solid var(--bd)}
#ed{background:var(--sf)}
.h{font-weight:800;font-size:20px;padding:2px 10px 14px;display:flex;align-items:center;gap:10px}
.h i{font-style:normal;width:32px;height:32px;border-radius:9px;background:var(--ac);display:grid;place-items:center;font-size:17px}
.it{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background .15s}
.it:hover{background:var(--ac2)}
.it.on{background:var(--ac2);color:var(--ac);font-weight:600}
.nr{display:flex;align-items:center;gap:2px}.nr .it{flex:1;min-width:0}
.xb{border:0;background:none;cursor:pointer;padding:6px 8px;border-radius:8px;color:var(--mu);font-size:13px;flex:none}.xb:hover{background:var(--ac2)}
.it span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it span:last-child{color:var(--mu);font-size:13px}
.sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:18px 12px 6px}
.inp{width:100%;box-sizing:border-box;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
#st{margin-top:auto;font-size:12px;color:var(--mu);padding:14px 10px 0}
.bar{display:flex;gap:8px;padding:12px;align-items:center}
.pb{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap;font-weight:600}
.pb:hover{filter:brightness(1.08)}
.pb:disabled{opacity:.6}
.gh{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:8px 11px;cursor:pointer}
.gh:hover{background:var(--ac2)}
#q{border-radius:999px;padding-inline:16px}
#items{overflow:auto;flex:1;padding:2px 8px 90px}
.nt{padding:12px 14px;margin-bottom:4px;border:1px solid transparent;border-radius:12px;cursor:pointer;transition:background .15s}
.nt:hover{background:var(--bg)}
.nt.on{background:var(--ac2);border-color:var(--ac2)}
.nt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt p{margin:2px 0 4px;color:var(--mu);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nt small{color:var(--mu);font-size:12px}
.vz{padding:40px 30px;text-align:center;color:var(--mu)}
#ed.empty .box{display:none}
#ed .vz{display:none;margin:auto}
#ed.empty .vz{display:block}
.box{display:flex;flex-direction:column;align-items:center;min-height:0;flex:1}
.box>*{width:100%;max-width:760px;box-sizing:border-box}
#ti{flex:1;min-width:0;border:0;outline:none;background:none;font-size:28px;font-weight:800;padding:8px 4px}
.meta{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
.meta .inp{width:auto;flex:1;min-width:130px;padding:7px 10px;font-size:14px}
.tb{display:flex;gap:2px;padding:4px;margin:0 16px 6px;width:auto!important;max-width:728px!important;background:var(--bg);border:1px solid var(--bd);border-radius:12px;overflow-x:auto}
.tb button{border:0;background:none;padding:0 10px;min-width:34px;height:34px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tb button:hover{background:var(--ac2)}
#bd{flex:1;overflow:auto;padding:12px 20px 60px;outline:none;word-break:break-word;font-size:17px;line-height:1.65;max-width:760px}
#bd h2{margin:.7em 0 .3em;font-size:22px}
#bd ul,#bd ol{padding-left:26px}
.todo{display:flex;gap:10px;align-items:baseline}
.todo input{width:19px;height:19px;accent-color:var(--ac);flex:none;transform:translateY(3px)}
.todo input:checked+span{text-decoration:line-through;color:var(--mu)}
#at{padding:0 16px}#at:empty{display:none}
.ch{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--bd);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;margin:0 6px 6px 0;max-width:100%}
.cb{border:0;background:none;cursor:pointer;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cb:hover{color:var(--ac)}
.bk{display:none}
#lg{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:radial-gradient(900px 500px at 15% 0%,var(--ac2),transparent),var(--bg)}
#lf{width:100%;max-width:360px;box-sizing:border-box;background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:34px 26px 28px;box-shadow:var(--sh);text-align:center;display:flex;flex-direction:column;gap:14px}
.lo{width:64px;height:64px;margin:0 auto;border-radius:18px;background:var(--ac);display:grid;place-items:center;font-size:30px}
#lf h1{margin:0;font-size:28px}
#lf p{margin:0;color:var(--mu);font-size:14px}
.pw{display:flex;gap:6px}.pw .inp{flex:1}
#le{color:#d6453d;font-size:14px}#le:empty{display:none}
#lb{padding:12px;font-size:16px}
@media (max-width:860px){
#app{grid-template-columns:1fr}
#nav,#list,#ed{display:none;border:0}
#app[data-v="nav"] #nav,#app[data-v="list"] #list,#app[data-v="edit"] #ed{display:flex}
.bk{display:inline-block}
#ti{font-size:24px}
.meta .inp{font-size:16px}
#add{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:14px 20px;box-shadow:var(--sh);z-index:5}
}
</style></head>
<body>
<div id="lg"><form id="lf"><div class="lo">📝</div><h1>Notas</h1><p>Entre com seu token para acessar e sincronizar suas notas.</p><div class="pw"><input id="lt" class="inp" type="password" placeholder="Token" autocomplete="current-password"><button type="button" class="gh" id="ls" aria-label="Mostrar token">👁</button></div><div id="le"></div><button class="pb" id="lb">Entrar</button></form></div>
<div id="app" data-v="list">
<aside id="nav">
<div class="h"><i>📝</i>Notas</div>
<div id="nv"></div>
<div class="sec">Novo caderno</div>
<input id="nn" class="inp" name="novo-caderno" autocomplete="off" autocapitalize="sentences" placeholder="Nome + Enter">
<div id="st"></div><button class="gh" id="ex" style="margin-top:10px">Exportar tudo</button><button class="gh" id="so" style="margin-top:8px">Sair</button>
</aside>
<section id="list">
<div class="bar"><button class="gh bk" id="bn" aria-label="Menu">☰</button><input id="q" class="inp" type="search" placeholder="Buscar…"><button class="pb" id="add">+ Nota</button></div>
<div id="items"></div>
</section>
<main id="ed" class="empty">
<div class="vz"><div style="font-size:44px">📝</div>Selecione ou crie uma nota.</div>
<div class="box">
<div class="bar"><button class="gh bk" id="bl" aria-label="Voltar">‹</button><input id="ti" placeholder="Título"></div>
<div class="meta"><select id="sb" class="inp"></select><input id="tg" class="inp" placeholder="tags, separadas por vírgula"><select id="dw" class="inp" style="flex:none;min-width:0"><option value="">⬇ Baixar</option><option value="html">HTML (formatado)</option><option value="md">Markdown (.md)</option><option value="txt">Texto (.txt)</option></select><button class="gh" id="dl">Excluir</button></div>
<div class="tb" id="tb">
<button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button>
<button data-c="h">H</button><button data-c="insertUnorderedList">• Lista</button><button data-c="insertOrderedList">1. Lista</button><button data-c="todo">☑ Tarefa</button><button type="button" id="up">📎 Anexar</button><input type="file" id="fi" multiple hidden>
</div>
<div id="at"></div>
<div id="bd" contenteditable="true"></div>
</div>
</main>
</div>
<script>
const $=s=>document.querySelector(s),LS="notas-v1";
let notes={},nbs=[],F={nb:null,tg:null,q:""},cur=null,loaded=null,col=null,tm,armed=false;
function el(t,c,x,k){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(k)e.onclick=k;return e}
function clean(h){const t=document.createElement("template");t.innerHTML=h||"";t.content.querySelectorAll("script,iframe,object,embed,style,link").forEach(n=>n.remove());t.content.querySelectorAll("*").forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value))n.removeAttribute(a.name)}));t.content.querySelectorAll(".todo input").forEach(i=>i.setAttribute("contenteditable","false"));return t.innerHTML}
function allNbs(){return [...new Set([...nbs,...Object.values(notes).map(n=>n.nb).filter(Boolean)])].sort((a,b)=>a.localeCompare(b))}
function vis(){const q=F.q.toLowerCase();return Object.entries(notes).filter(([i,n])=>(F.nb===null||n.nb===F.nb)&&(!F.tg||(n.tg||[]).includes(F.tg))&&(!q||((n.t||"")+" "+(n.x||"")+" "+(n.tg||[]).join(" ")).toLowerCase().includes(q))).sort((a,b)=>b[1].u-a[1].u)}
let delArm=false;
function delNb(n){nbs=nbs.filter(x=>x!==n);Object.entries(notes).forEach(([id,x])=>{if(x.nb===n){x.nb="";x.u=Date.now();persist(id)}});persist("meta");F.nb=null;render()}
function renderNav(){
  const nv=$("#nv");nv.textContent="";
  const row=(l,c,on,k)=>{const b=el("button","it"+(on?" on":""),null,k);b.append(el("span","",l),el("span","",c));return b};
  const all=Object.values(notes);
  nv.append(row("Todas as notas",all.length,F.nb===null&&!F.tg,()=>{F.nb=null;F.tg=null;go("list");render()}));
  allNbs().forEach(n=>{
    const w=el("div","nr");
    w.append(row("📓 "+n,all.filter(x=>x.nb===n).length,F.nb===n,()=>{F.nb=n;F.tg=null;go("list");render()}));
    const x=el("button","xb",delArm===n?"Apagar?":"🗑",e=>{e.stopPropagation();if(delArm!==n){delArm=n;setTimeout(()=>{if(delArm===n){delArm=false;renderNav()}},3000);renderNav();return}delArm=false;delNb(n)});
    x.title="Excluir caderno";w.append(x);nv.append(w);
  });
  const tags=[...new Set(all.flatMap(n=>n.tg||[]))].sort();
  if(tags.length){nv.append(el("div","sec","Tags"));tags.forEach(t=>nv.append(row("# "+t,all.filter(x=>(x.tg||[]).includes(t)).length,F.tg===t,()=>{F.tg=t;F.nb=null;go("list");render()})))}
}
function renderList(){
  const box=$("#items");box.textContent="";const v=vis();
  if(!v.length){box.append(el("div","vz",Object.keys(notes).length?"Nada encontrado.":"Nenhuma nota ainda. Toque em + Nota."));return}
  v.forEach(([id,n])=>{
    const d=el("div","nt"+(id===cur?" on":""),null,()=>open(id));
    d.append(el("b","",n.t||"Sem título"),el("p","",(n.x||"").trim().slice(0,160)||"Nota vazia"),el("small","",new Date(n.u).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})+((n.tg||[]).length?" · "+n.tg.map(t=>"#"+t).join(" "):"")));
    box.append(d);
  });
}
function renderEd(){
  const n=notes[cur];$("#ed").classList.toggle("empty",!n);
  if(!n){loaded=null;return}
  if(loaded!==cur){loaded=cur;$("#ti").value=n.t||"";$("#bd").innerHTML=clean(n.h)}
  else if(document.activeElement!==$("#bd")&&document.activeElement!==$("#ti")){$("#ti").value=n.t||"";$("#bd").innerHTML=clean(n.h)}
  if(document.activeElement!==$("#tg"))$("#tg").value=(n.tg||[]).join(", ");
  const s=$("#sb");s.textContent="";const o=el("option","","Sem caderno");o.value="";s.append(o);
  allNbs().forEach(x=>{const e=el("option","","📓 "+x);e.value=x;s.append(e)});s.value=n.nb||"";renderAt();
}
function render(){renderNav();renderList();renderEd()}
function go(v){$("#app").dataset.v=v}
function flush(){clearTimeout(tm);if(cur&&notes[cur])persist(cur)}
function open(id){flush();cur=id;loaded=null;render();go("edit")}
function touch(){
  const n=notes[cur];if(!n)return;const id=cur;
  n.t=$("#ti").value;n.h=$("#bd").innerHTML;n.x=$("#bd").innerText;n.u=Date.now();
  clearTimeout(tm);tm=setTimeout(()=>persist(id),500);renderList();
}
$("#add").onclick=()=>{flush();const id="n"+Date.now().toString(36);notes[id]={t:"",h:"",x:"",nb:F.nb||"",tg:[],u:Date.now()};persist(id);open(id);setTimeout(()=>$("#ti").focus(),50)};
$("#q").oninput=e=>{F.q=e.target.value;renderList()};
$("#ti").oninput=touch;$("#bd").oninput=touch;
$("#bn").onclick=()=>go("nav");$("#bl").onclick=()=>{flush();go("list")};
$("#tg").onchange=e=>{const n=notes[cur];if(!n)return;n.tg=[...new Set(e.target.value.split(",").map(t=>t.trim().replace(/^#/,"")).filter(Boolean))];n.u=Date.now();persist(cur);render()};
$("#sb").onchange=e=>{const n=notes[cur];if(!n)return;n.nb=e.target.value;n.u=Date.now();persist(cur);render()};
$("#nn").onkeydown=e=>{if(e.key!=="Enter")return;const v=e.target.value.trim();if(v&&!allNbs().includes(v)){nbs.push(v);persist("meta")}e.target.value="";render()};
$("#dl").onclick=e=>{
  if(!armed){armed=true;e.target.textContent="Confirmar?";setTimeout(()=>{armed=false;e.target.textContent="Excluir"},2500);return}
  armed=false;e.target.textContent="Excluir";const id=cur;clearTimeout(tm);((notes[id]||{}).at||[]).forEach(f=>api({action:"delfile",id:f.id}).catch(()=>{}));delete notes[id];S.tomb[id]=Date.now();cur=null;loaded=null;persist(id);render();go("list");
};
function caret(n){const r=document.createRange();r.selectNodeContents(n);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function mkTodo(){const d=el("div","todo");const i=document.createElement("input");i.type="checkbox";i.setAttribute("contenteditable","false");const s=el("span","","\u200b");d.append(i,s);return d}
$("#tb").onmousedown=e=>e.preventDefault();
$("#tb").onclick=e=>{
  const c=e.target.closest("button")?.dataset.c;if(!c)return;$("#bd").focus();
  if(c==="h")document.execCommand("formatBlock",false,"h2");
  else if(c==="todo"){const s=getSelection();const t=mkTodo();const a=s.anchorNode&&(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement);const b=a&&a.closest("#bd>*");if(b&&!b.textContent.trim())b.replaceWith(t);else if(b)b.after(t);else $("#bd").append(t);caret(t.querySelector("span"))}
  else document.execCommand(c);
  touch();
};
$("#bd").addEventListener("change",e=>{if(e.target.matches(".todo input")){e.target.toggleAttribute("checked",e.target.checked);touch()}});
$("#bd").addEventListener("paste",e=>{e.preventDefault();document.execCommand("insertText",false,e.clipboardData.getData("text/plain"))});
$("#bd").addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;const s=getSelection();if(!s.rangeCount)return;
  const a=s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement;const td=a.closest(".todo");if(!td)return;
  e.preventDefault();
  if(!td.textContent.replace(/\u200b/g,"").trim()){const p=el("div");p.innerHTML="<br>";td.replaceWith(p);caret(p)}
  else{const t=mkTodo();td.after(t);caret(t.querySelector("span"))}
  touch();
});
window.addEventListener("pagehide",flush);
const API="https://rmfidelis-n8n.ddns.net/webhook/notas";
let S={last:0,dirty:{},tomb:{},mu:0},busy=false,st;
function save(){try{localStorage.setItem(LS,JSON.stringify({notes,nbs,S}))}catch(e){}}
function persist(id){S.dirty[id]=Date.now();if(id==="meta")S.mu=Date.now();save();clearTimeout(st);st=setTimeout(sync,800)}
function status(t){$("#st").textContent=t}
async function sync(){
  const tk=localStorage.getItem("notas-token");
  if(!tk){showLogin();return}
  if(busy){clearTimeout(st);st=setTimeout(sync,1500);return}
  busy=true;const sent={...S.dirty};
  const changes=Object.keys(sent).map(id=>id==="meta"?{id,list:nbs,u:S.mu}:notes[id]?{...notes[id],id}:{id,del:true,u:S.tomb[id]||Date.now()});
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:tk,since:S.last,changes})});
    if(r.status===401){localStorage.removeItem("notas-token");busy=false;showLogin("Token inválido. Entre novamente.");return}
    if(!r.ok)throw 0;
    const d=await r.json();
    Object.keys(sent).forEach(id=>{if(S.dirty[id]===sent[id])delete S.dirty[id]});
    (d.items||[]).forEach(it=>{
      if(S.dirty[it.id])return;
      if(it.id==="meta"){nbs=it.list||[];return}
      if(it.del){delete notes[it.id];if(cur===it.id){cur=null;loaded=null}}
      else notes[it.id]=it;
    });
    S.last=d.seq;save();render();status("Sincronizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){status("Offline: salvo neste aparelho")}
  busy=false;
}
function showLogin(m){$("#lg").style.display="flex";$("#le").textContent=m||"";$("#lt").focus()}
function hideLogin(){$("#lg").style.display="none"}
async function login(e){
  e.preventDefault();const v=$("#lt").value.trim();if(!v)return;
  const b=$("#lb");b.disabled=true;b.textContent="Entrando…";$("#le").textContent="";
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:v,since:0,changes:[]})});
    if(r.status===401)$("#le").textContent="Token incorreto.";
    else if(!r.ok)throw 0;
    else{localStorage.setItem("notas-token",v);$("#lt").value="";S.last=0;hideLogin();sync()}
  }catch(x){$("#le").textContent="Não foi possível conectar ao servidor."}
  b.disabled=false;b.textContent="Entrar";
}
async function logout(){
  if(Object.keys(S.dirty).length)await sync();
  if(Object.keys(S.dirty).length){status("Há notas não sincronizadas. Tente de novo com internet.");return}
  localStorage.removeItem("notas-token");localStorage.removeItem(LS);
  notes={};nbs=[];S={last:0,dirty:{},tomb:{},mu:0};cur=null;loaded=null;render();go("list");showLogin();
}
let armF=null;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=b=>b>1e6?(b/1e6).toFixed(1)+" MB":Math.max(1,Math.round(b/1e3))+" KB";
async function api(o){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:localStorage.getItem("notas-token"),...o})});if(r.status===401){localStorage.removeItem("notas-token");showLogin("Token inválido. Entre novamente.")}return r}
function dl(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function toMd(root){
  const out=[];
  const inl=n=>{if(n.nodeType===3)return n.textContent.replace(/\u200b/g,"");if(n.nodeType!==1)return"";const t=n.tagName,c=[...n.childNodes].map(inl).join("");
    if(t==="B"||t==="STRONG")return c.trim()?"**"+c+"**":c;if(t==="I"||t==="EM")return c.trim()?"*"+c+"*":c;if(t==="BR")return"\n";if(t==="INPUT")return"";return c};
  [...root.childNodes].forEach(n=>{
    if(n.nodeType===3){const t=n.textContent.trim();if(t)out.push(t,"");return}
    if(n.nodeType!==1)return;const t=n.tagName;
    if(t==="H2")out.push("## "+inl(n),"");
    else if(t==="UL")out.push(...[...n.children].map(li=>"- "+inl(li)),"");
    else if(t==="OL")out.push(...[...n.children].map((li,i)=>(i+1)+". "+inl(li)),"");
    else if(n.classList.contains("todo"))out.push("- ["+(n.querySelector("input")?.checked?"x":" ")+"] "+inl(n).trim());
    else out.push(inl(n),"");
  });
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
$("#dw").onchange=e=>{
  const k=e.target.value;e.target.value="";if(!k||!notes[cur])return;
  const t=$("#ti").value||"Sem título",base=t.replace(/[\\/:*?"<>|]+/g,"").trim()||"nota",bd=$("#bd");
  if(k==="html")dl(base+".html",new Blob(['<!DOCTYPE html><html lang="pt-BR"><meta charset="utf-8"><title>'+esc(t)+'</title><body style="font:17px/1.6 system-ui,sans-serif;max-width:720px;margin:2em auto;padding:0 1em"><h1>'+esc(t)+"</h1>"+bd.innerHTML],{type:"text/html"}));
  else if(k==="md")dl(base+".md",new Blob(["# "+t+"\n\n"+toMd(bd)+"\n"],{type:"text/markdown"}));
  else dl(base+".txt",new Blob([t+"\n\n"+bd.innerText],{type:"text/plain"}));
};
$("#ex").onclick=()=>dl("notas-backup-"+new Date().toISOString().slice(0,10)+".json",new Blob([JSON.stringify({cadernos:allNbs(),notas:notes},null,1)],{type:"application/json"}));
function renderAt(){
  const n=notes[cur],box=$("#at");box.textContent="";if(!n)return;
  (n.at||[]).forEach(f=>{
    const c=el("span","ch"),b=el("button","cb","📎 "+f.name+" · "+fmt(f.size),()=>getFile(f)),
    x=el("button","cb",armF===f.id?"Remover?":"✕",()=>{
      if(armF!==f.id){armF=f.id;setTimeout(()=>{if(armF===f.id){armF=null;renderAt()}},3000);renderAt();return}
      armF=null;const m=notes[cur];if(!m)return;m.at=(m.at||[]).filter(y=>y.id!==f.id);m.u=Date.now();persist(cur);api({action:"delfile",id:f.id}).catch(()=>{});renderAt();
    });
    b.title="Baixar";x.title="Remover anexo";c.append(b,x);box.append(c);
  });
}
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});
function shrink(f){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.82)};i.onerror=rej;i.src=u})}
async function addFile(f,nid){
  try{
    status("Enviando "+f.name+"…");
    let blob=f,type=f.type||"application/octet-stream",name=f.name;
    if(/^image\/(jpeg|png|webp)$/.test(type)&&f.size>300000){blob=await shrink(f);type="image/jpeg";name=name.replace(/\.\w+$/,"")+".jpg"}
    if(blob.size>4e6){status(f.name+" passa de 4 MB e não foi enviado");return}
    const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const r=await api({action:"putfile",file:{id,name,type,data:await b64(blob)}});
    if(!r.ok)throw 0;
    const n=notes[nid];if(!n)return;
    (n.at=n.at||[]).push({id,name,type,size:blob.size});n.u=Date.now();persist(nid);if(cur===nid)renderAt();status("Anexo enviado: "+name);
  }catch(x){status("Falha ao enviar "+f.name)}
}
$("#up").onclick=()=>{if(notes[cur])$("#fi").click()};
$("#fi").onchange=async e=>{const fs=[...e.target.files],nid=cur;e.target.value="";for(const f of fs)await addFile(f,nid)};
async function getFile(f){
  try{
    status("Baixando "+f.name+"…");
    const r=await api({action:"getfile",id:f.id});if(!r.ok)throw 0;
    const d=await r.json();if(!d.data)throw 0;
    const bin=atob(d.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    dl(f.name,new Blob([u],{type:f.type}));status("Download pronto: "+f.name);
  }catch(e){status("Não foi possível baixar "+f.name)}
}
function init(){
  try{const d=JSON.parse(localStorage.getItem(LS)||"{}");notes=d.notes||{};nbs=d.nbs||[];S={...S,...(d.S||{})}}catch(e){}
  $("#lf").onsubmit=login;$("#ls").onclick=()=>{const t=$("#lt");t.type=t.type==="password"?"text":"password"};$("#so").onclick=logout;
  render();sync();
  setInterval(()=>{if(!document.hidden)sync()},30000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
init();
